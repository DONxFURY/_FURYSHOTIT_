<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reels Grid</title>

<style>
  body {
    margin: 0;
    background: #0a0a0a;
    font-family: Arial, sans-serif;
    color: white;
  }

  h1 {
    text-align: center;
    padding: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
  }

  .card {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #111;
  }

  .video {
    position: relative;
    width: 100%;
    padding-bottom: 177.78%; /* 9:16 ratio */
  }

  .video iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: none;
    top: 0;
    left: 0;
  }

  .overlay {
    position: absolute;
    bottom: 10px;
    left: 10px;
    right: 10px;
    color: white;
    font-size: 14px;
    text-shadow: 0 0 5px rgba(0,0,0,0.7);
  }

  .overlay strong {
    display: block;
    font-size: 16px;
  }

  @media (max-width: 900px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 600px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<h1>🔥 Game Clips</h1>

<div class="grid">

  <div class="card">
    <div class="video">
      <iframe src="https://streamable.com/e/jcxdnq" allowfullscreen></iframe>
    </div>
    <div class="overlay">
      <strong>@FURYSHOTIT</strong>
      First clip 🔥
    </div>
  </div>

  <div class="card">
    <div class="video">
      <iframe src="https://streamable.com/e/hqs1cj" allowfullscreen></iframe>
    </div>
    <div class="overlay">
      <strong>@FURYSHOTIT</strong>
      Second clip 👀
    </div>
  </div>

  <div class="card">
    <div class="video">
      <iframe src="https://streamable.com/e/a3dbom" allowfullscreen></iframe>
    </div>
    <div class="overlay">
      <strong>@FURYSHOTIT</strong>
      Third clip 🚀
    </div>
  </div>

</div>

</body>
</html>
