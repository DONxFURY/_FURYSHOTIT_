<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reels Grid</title>

<style>
  body {
    margin: 0;
    background: #0a0a0a;
    font-family: Arial, sans-serif;
    color: white;
  }

  h1 {
    text-align: center;
    padding: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
  }

  .card {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #111;
  }

  iframe {
    width: 100%;
    height: 500px;
    border: none;
  }

  .overlay {
    position: absolute;
    bottom: 10px;
    left: 10px;
    right: 10px;
    color: white;
    font-size: 14px;
  }

  .overlay strong {
    display: block;
    font-size: 16px;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 600px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<h1>🔥 Game Clips</h1>

<div class="grid">

  <div class="card">
    <iframe src="https://streamable.com/e/abcd12" allowfullscreen></iframe>
    <div class="overlay">
      <strong>@yourgame</strong>
      First clip 🔥
    </div>
  </div>

  <div class="card">
    <iframe src="https://streamable.com/e/efgh34" allowfullscreen></iframe>
    <div class="overlay">
      <strong>@yourgame</strong>
      Second clip 👀
    </div>
  </div>

  <div class="card">
    <iframe src="https://streamable.com/e/ijkl56" allowfullscreen></iframe>
    <div class="overlay">
      <strong>@yourgame</strong>
      Third clip 🚀
    </div>
  </div>

  <!-- Add more cards below -->
  
</div>

</body>
</html>
